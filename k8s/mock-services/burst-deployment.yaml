apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-target-service
  namespace: adaptive-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burst-target-service
  template:
    metadata:
      labels:
        app: burst-target-service
    spec:
      containers:
        - name: burst-target-service
          image: burst-target-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: burst-target-svc
  namespace: adaptive-gateway
spec:
  selector:
    app: burst-target-service
  ports:
    - port: 3003
      targetPort: 3003
